# Port of the REST interface; override with the environment variable SERVER_PORT
server.port=12110

# Maximum number of results kept per continuous query until the Knowledge Layer fetches them;
# when full, the oldest results are dropped. Override with CQELS_RESULTS_BUFFER_SIZE
cqels.results-buffer-size=${CQELS_RESULTS_BUFFER_SIZE:1000}

# How much later than a newer element of the same stream an element may arrive and still be
# used (the engine drops elements that arrive after a newer one has closed their window).
# Elements are held until the stream is this far ahead or they have waited this long in real
# time, then pushed in event-time order.
# Override with CQELS_REORDER_TOLERANCE, for example 1s; 0ms turns the reordering off
cqels.reorder-tolerance=${CQELS_REORDER_TOLERANCE:500ms}
