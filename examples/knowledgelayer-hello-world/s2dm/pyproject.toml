[project]
name = "s2dm-config-gen"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["s2dm==0.21.0", "ruamel.yaml>=0.18", "rdflib>=7.0"]

[project.scripts]
s2dmc = "s2dmc.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s2dmc"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
