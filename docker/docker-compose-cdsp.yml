name: cdsp

x-knowledge-layer-common: &knowledge-layer-common
  build:
    context: ../cdsp/knowledge-layer
    dockerfile: Dockerfile
  container_name: knowledge-layer
  entrypoint: ["/src/build/bin/reasoner_client"]
  # Start with an empty datastore: the RDFox datastore is persistent and would keep rules and data
  # from earlier runs (RDF4J is in-memory anyway).
  command: -X reset_ds
  env_file:
    - .env

services:

  # S2DM Config Generator (run once): generates the Knowledge Layer SHACL shapes and the
  # Information Layer schema from the GraphQL schema
  s2dm-config-gen:
    build:
      context: ../cdsp/s2dm
    container_name: s2dm-config-gen
    restart: "no" # one-shot, same as rdfox-init
    volumes:
      - ../cdsp/information-layer/handlers/config/schema-files:/out/il
      - ../cdsp/knowledge-layer/symbolic-reasoner/examples/use-case/shared/shacl:/out/kl

# Apache IoTDB acting as VSS Data Store
  iotdb-service:
    hostname: iotdb-service
    container_name: iotdb-service
    build:
      context: iotdb  # CDSP IoTDB image
      args:
        IOTDB_VERSION: 2.0.8
        SERVICE_HOSTNAME: iotdb-service
    restart: on-failure:3
    ports:
      - "6667:6667"
    environment:
      - cn_internal_address=iotdb-service
      - cn_internal_port=10710
      - cn_consensus_port=10720
      - cn_seed_config_node=iotdb-service:10710
      - dn_rpc_address=iotdb-service
      - dn_internal_address=iotdb-service
      - dn_rpc_port=6667
      - dn_mpp_data_exchange_port=10740
      - dn_schema_region_consensus_port=10750
      - dn_data_region_consensus_port=10760
      - dn_seed_config_node=iotdb-service:10710
    volumes:
      - ./iotdb-data:/iotdb/data
      - ./iotdb-logs:/iotdb/logs
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://iotdb-service:18080/ping" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
      start_interval: 5s


# Information Layer Server exposing websocket API
  information-layer:
    build:
      context: ../cdsp/information-layer
      dockerfile: Dockerfile
    container_name: information-layer
    ports:
      - "8080:8080" 
    volumes:
      - ./logs/information-layer:/app/logs
      # Schema generated by s2dm-config-gen
      - ../cdsp/information-layer/handlers/config/schema-files:/app/dist/handlers/config/schema-files
    env_file:
      - .env
    depends_on:
      iotdb-service:
        condition: service_healthy
      s2dm-config-gen:
        condition: service_completed_successfully

  # RDFox Initialization (run once)
  rdfox-init:
    image: oxfordsemantic/rdfox-init:latest
    container_name: rdfox-init
    platform: linux/amd64
    profiles: ["rdfox"]
    volumes:
      - ${RDFOX_LIC_PATH}:/opt/RDFox/RDFox.lic  # License file on host
      - rdfox-server-directory:/home/rdfox/.RDFox
    environment:
      - RDFOX_ROLE=root
      - RDFOX_PASSWORD=admin
    command: |
      -persistence file -channel unsecure init
    restart: "no"

  # RDFox Daemon (persistent service)
  rdfox-service:
    image: oxfordsemantic/rdfox:latest
    container_name: rdfox-service
    platform: linux/amd64
    profiles: ["rdfox"]
    depends_on:
      rdfox-init:
        condition: service_completed_successfully
    ports:
      - "12110:12110"
    volumes:
      - ${RDFOX_LIC_PATH}:/opt/RDFox/RDFox.lic  # License file on host
      - rdfox-server-directory:/home/rdfox/.RDFox
    environment:
      - RDFOX_ROLE=root
      - RDFOX_PASSWORD=admin
    command: daemon
    healthcheck:
      # RDFox answers GET /health with 204. The image has no curl or wget, so bash opens the connection.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12110 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 204 '"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "2.0"
    restart: "always"

  # RDF4J Stream Reasoner (open-source, no license required)
  rdf4j-stream-reasoner-service:
    profiles: ["rdf4j"]
    build:
      context: rdf4j
    image: rdf4j-stream-reasoner:latest
    container_name: rdf4j-stream-reasoner-service
    ports:
      - "12110:12110"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:12110/datastores"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

 # VISSR acting as VISS Data Server

  tmp:
    image: busybox
    container_name: vissr_container_volumes
    user: root
    command: >
      chmod -R 777 /tmp/docker/
    volumes:
      - /tmp/docker/
      - /var/tmp/vissv2/

  redis:
    image: redis
    container_name: app_redis
    privileged: true
    user: root
    restart: on-failure:3
    command: redis-server /etc/redis.conf
    volumes:
      - ../cdsp/vissr/redis/redis.conf:/etc/redis.conf
    volumes_from:
      - tmp

  vissv2server:
    container_name: vissv2server
    depends_on:
      - redis
      - iotdb-service
    restart: on-failure:3
    build:
      context: ../cdsp/vissr  # context set to repo root
      dockerfile: Dockerfile.rlserver
      target: vissv2server
    entrypoint: [ /app/vissv2server,-s,apache-iotdb]
    ports:
      - "0.0.0.0:8081:8081"
      - "127.0.0.1:8888:8888"
      - "0.0.0.0:8887:8887"
      - "0.0.0.0:8600:8600"
    volumes:
      - ./vissr-logs:/app/logs
    volumes_from:
      - tmp

# Knowledge Layer Server using RDFox
  knowledge-layer-rdfox:
    <<: *knowledge-layer-common
    profiles: ["rdfox"]
    volumes:
      # SHACL shapes generated by s2dm-config-gen
      - ../cdsp/knowledge-layer/symbolic-reasoner/examples/use-case/shared/shacl:/src/symbolic-reasoner/examples/use-case/shared/shacl
    depends_on:
      s2dm-config-gen:
        condition: service_completed_successfully
      rdfox-service:
        condition: service_healthy
      information-layer:
        condition: service_started
    environment:
      - HOST_REASONER_SERVER=rdfox-service
      - MODEL_CONFIGURATION_PATH=/symbolic-reasoner/examples/use-case/rdfox_model/

  # Knowledge Layer Server using RDF4J
  knowledge-layer-rdf4j:
    <<: *knowledge-layer-common
    profiles: ["rdf4j"]
    volumes:
      # SHACL shapes generated by s2dm-config-gen
      - ../cdsp/knowledge-layer/symbolic-reasoner/examples/use-case/shared/shacl:/src/symbolic-reasoner/examples/use-case/shared/shacl
    depends_on:
      s2dm-config-gen:
        condition: service_completed_successfully
      rdf4j-stream-reasoner-service:
        condition: service_healthy
      information-layer:
        condition: service_started
    environment:
      - HOST_REASONER_SERVER=rdf4j-stream-reasoner-service
      - MODEL_CONFIGURATION_PATH=/symbolic-reasoner/examples/use-case/rdf4j_model/

volumes:
  rdfox-server-directory:
